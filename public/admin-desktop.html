<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080a0e" />
  <title>Star Club Desktop Admin</title>
  <link rel="stylesheet" href="/admin.css?v=80" />
  <link rel="stylesheet" href="/admin-desktop.css" />
</head>
<body class="desktop-admin-body">
  <div id="adminLogin" class="admin-login hidden desktop-login">
    <div class="login-card desktop-login-card">
      <div class="brand-mark">★</div>
      <h1>Star Club ПК-адмінка</h1>
      <p>Вхід для Owner/Admin через логін і пароль. Telegram-адмінка на телефоні залишається окремо через команду <b>/admin</b>.</p>
      <form id="passwordAdminLogin" class="password-login-form">
        <input name="login" autocomplete="username" placeholder="Логін" required>
        <input name="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
        <button class="primary login-primary">Увійти в ПК-адмінку</button>
      </form>
      <details class="key-login">
        <summary>Резервний вхід за ADMIN_API_KEY</summary>
        <input id="loginApiKey" placeholder="ADMIN_API_KEY">
        <button id="keyAdminLogin">Увійти за ключем</button>
      </details>
    </div>
  </div>

  <aside class="sidebar desktop-sidebar" id="sidebar">
    <div class="brand">
      <span>★</span>
      <div><b>Star Club</b><small>Desktop Admin</small></div>
    </div>
    <nav class="desktop-nav" aria-label="Навігація ПК-адмінки">
      <button data-tab="dashboard" class="active"><span class="nav-icon">⌂</span><span>Аналітика</span></button>
      <button data-tab="clients"><span class="nav-icon">◎</span><span>Клієнти</span></button>
      <button data-tab="stores"><span class="nav-icon">⌖</span><span>Магазини</span></button>
      <button data-tab="rewards"><span class="nav-icon">★</span><span>Товари за зірки</span></button>
      <button data-tab="star-exclusions" data-permission="rewards"><span class="nav-icon">⊘</span><span>Не нараховувати зірки</span></button>
      <button data-tab="offers"><span class="nav-icon">◇</span><span>Пропозиції та ціни</span></button>
      <button data-tab="challenges"><span class="nav-icon">🏆</span><span>Челенджі</span></button>
      <button data-tab="stamps"><span class="nav-icon">◫</span><span>Накопичувальні</span></button>
      <button data-tab="banners" data-permission="news"><span class="nav-icon">▧</span><span>Банери</span></button>
      <button data-tab="news"><span class="nav-icon">▤</span><span>Новини</span></button>
      <button data-tab="qrs"><span class="nav-icon">▦</span><span>QR/коди</span></button>
      <button data-tab="support"><span class="nav-icon">✉</span><span>Підтримка</span></button>
      <button data-tab="admins" data-owner-only><span class="nav-icon">♙</span><span>Адміністратори</span></button>
      <button data-tab="settings"><span class="nav-icon">⚙</span><span>Налаштування</span></button>
      <button data-tab="audit"><span class="nav-icon">≡</span><span>Журнал</span></button>
      <a href="/admin" target="_blank"><span class="nav-icon">↗</span><span>Мобільна адмінка</span></a>
    </nav>
  </aside>

  <div class="mobile-shell desktop-workspace">
    <main>
      <header class="page-header desktop-page-header">
        <div>
          <span class="eyebrow">ПК-панель керування</span>
          <h1 id="title">Аналітика</h1>
        </div>
        <div class="desktop-key-tools">
          <input id="apiKey" placeholder="ADMIN_API_KEY" />
          <button id="saveKey">Зберегти ключ</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/admin.js?v=80"></script>
</body>
</html>
